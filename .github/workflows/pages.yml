# Serve demo/ (static, aggregates only) with GitHub Pages.
# Activation (Nat, when the repo is public — or on a plan that allows Pages for private repos):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions". Then push to main or run this workflow manually.
name: demo-pages
on:
  push:
    branches: [main]
    paths: ["demo/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
